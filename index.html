<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>轻盈维先 · 已用药患者管理服务平台（演示）</title>
<style>
:root{
  --mint:#2BB5A0; --mint-dark:#1E9C89; --mint-light:#E4F7F2; --mint-bg:#F2FAF7;
  --ink:#1F2D2A; --sub:#7A8B87; --line:#E3EFEA; --warn:#E8833A; --red:#D9534F;
  --card-r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--mint-bg);color:var(--ink);max-width:480px;margin:0 auto;min-height:100vh}
button{font-family:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:#fff;outline:none}
input:focus,select:focus{border-color:var(--mint)}
img{max-width:100%}
.hide{display:none!important}

/* 顶部 */
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#2BB5A0,#3EC9B2);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:10px}
.topbar .back{width:34px;height:34px;border-radius:12px;background:#fff;color:var(--mint-dark);flex:none;box-shadow:0 2px 8px rgba(15,60,50,.18);display:flex;align-items:center;justify-content:center;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .15s}
.topbar .back:active{transform:scale(.9);opacity:.7}
.topbar .back .chev{font-size:1.35rem;font-weight:800;line-height:1;margin-top:-2px}
.topbar h1{font-size:1.05rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .mini{font-size:.68rem;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:20px;flex:none}

.demo-strip{position:sticky;top:54px;z-index:49;background:#FFF7E8;color:#9A6B1F;font-size:.72rem;text-align:center;padding:5px 10px;border-bottom:1px solid #F3E3C2}

.screen{padding:14px 14px 86px}
.page-title{font-size:1.15rem;font-weight:700;margin:6px 2px 12px}
.card{background:#fff;border-radius:var(--card-r);padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(30,156,137,.06)}
.card h3{font-size:.95rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.muted{color:var(--sub);font-size:.8rem;line-height:1.6}
.tiny{font-size:.7rem;color:var(--sub)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.btn{display:block;width:100%;background:var(--mint);color:#fff;font-size:1rem;font-weight:600;padding:13px;border-radius:12px;text-align:center}
.btn:active{background:var(--mint-dark)}
.btn.ghost{background:var(--mint-light);color:var(--mint-dark)}
.btn.line{background:#fff;color:var(--mint-dark);border:1px solid var(--mint)}
.btn.sm{width:auto;display:inline-block;padding:7px 14px;font-size:.82rem;border-radius:9px}
.btn.gray{background:#EEF3F1;color:var(--sub)}
.btn.danger{background:#FBEAEA;color:var(--red)}
.link{color:var(--mint-dark);font-size:.82rem}
.tag{display:inline-block;font-size:.68rem;background:var(--mint-light);color:var(--mint-dark);border-radius:20px;padding:2px 9px;margin:2px 4px 2px 0}
.tag.warn{background:#FDF0E4;color:var(--warn)}
.tag.gray{background:#EEF2F1;color:var(--sub)}

.list-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.list-item:last-child{border-bottom:none}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--mint-light);color:var(--mint-dark);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:.9rem}
.avatar.lg{width:56px;height:56px;font-size:1.1rem}

/* 底部 Tab */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;z-index:60;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;text-align:center;color:var(--sub);font-size:.66rem;padding:4px 0}
.tabbar .ico{font-size:1.25rem;display:block;margin-bottom:2px}
.tabbar button.on{color:var(--mint-dark);font-weight:600}

/* 宫格 */
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.svc-grid button{background:#fff;border-radius:12px;padding:14px 4px;text-align:center;font-size:.72rem;color:var(--ink)}
.svc-grid .ico{font-size:1.5rem;display:block;margin-bottom:6px}

/* 表单 */
.field{margin-bottom:14px}
.field label{display:block;font-size:.82rem;color:var(--sub);margin-bottom:6px}
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:.82rem;background:#fff}
.chip.on{background:var(--mint);color:#fff;border-color:var(--mint)}

/* 扫码动画 */
.scan-box{position:relative;width:220px;height:220px;margin:10px auto;border:3px solid var(--mint);border-radius:18px;overflow:hidden;background:#0e2b26}
.scan-box .corner{position:absolute;width:26px;height:26px;border:4px solid #fff;opacity:.9}
.scan-box .c1{top:8px;left:8px;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.scan-box .c2{top:8px;right:8px;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
.scan-box .c3{bottom:8px;left:8px;border-right:none;border-top:none;border-radius:0 0 0 8px}
.scan-box .c4{bottom:8px;right:8px;border-left:none;border-top:none;border-radius:0 0 8px 0}
.scan-line{position:absolute;left:12px;right:12px;height:3px;background:linear-gradient(90deg,transparent,#5CE8D0,transparent);box-shadow:0 0 12px #5CE8D0;animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%{top:14px}50%{top:196px}100%{top:14px}}
.scan-txt{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#BFEEE5;font-size:.75rem}

/* 时间轴 */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:10px 0 14px}
.tl-item::before{content:'';position:absolute;left:-20px;top:16px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--mint)}
.tl-item h4{font-size:.88rem;margin-bottom:4px}
.tl-item .meta{font-size:.75rem;color:var(--sub);line-height:1.7}
.temp-wrap{background:#0F2E29;border-radius:12px;padding:10px;margin-top:8px}

/* 徽章 */
.badge-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.badge-item{text-align:center}
.badge-item .b{width:52px;height:52px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:#EEF3F1}
.badge-item.locked .b{filter:grayscale(1);opacity:.45}
.badge-item span{font-size:.62rem;color:var(--sub)}

/* 广场 */
.post-actions{display:flex;gap:18px;margin-top:8px;font-size:.78rem;color:var(--sub)}
.post-actions button{color:var(--sub);font-size:.78rem}
.post-actions button.liked{color:var(--mint-dark)}

/* 开关 */
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .sl{position:absolute;inset:0;background:#D7E2DE;border-radius:20px;transition:.2s}
.switch .sl::before{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .sl{background:var(--mint)}
.switch input:checked + .sl::before{transform:translateX(20px)}

/* 模态 / Toast */
.modal-mask{position:fixed;inset:0;background:rgba(15,40,35,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal-mask.center{align-items:center;padding:24px}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:22px 18px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;animation:up .25s}
.modal-mask.center .modal{border-radius:18px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(20,40,36,.88);color:#fff;padding:12px 22px;border-radius:12px;font-size:.85rem;z-index:200;display:none;max-width:80%;text-align:center;line-height:1.6}
.remind-pop{position:fixed;inset:0;background:rgba(15,40,35,.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:30px}
.remind-pop .inner{background:#fff;border-radius:18px;padding:24px 20px;width:100%;max-width:340px;text-align:center;animation:up .3s}
.remind-pop .bell{font-size:2.4rem;margin-bottom:8px}

/* 水印 */
.watermark{position:relative;overflow:hidden}
.watermark::after{content:'演示流程';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:rgba(30,156,137,.10);transform:rotate(-24deg);pointer-events:none;font-weight:700}

/* 固定提示条 R2 */
.r2-bar{position:sticky;top:96px;z-index:40;background:#FFF4E5;color:#8A5A17;font-size:.74rem;padding:8px 12px;border-radius:10px;border:1px solid #F3DFC0;margin-bottom:10px;line-height:1.5}
canvas.chart{width:100%;height:180px;display:block}
.progress-note{display:flex;justify-content:space-between;font-size:.7rem;color:var(--sub);margin-top:4px}
.step-dots{display:flex;justify-content:center;gap:8px;margin:8px 0 14px}
.step-dots i{width:8px;height:8px;border-radius:50%;background:#CFE6E0}
.step-dots i.on{background:var(--mint);width:22px;border-radius:6px}
.hr{height:1px;background:var(--line);margin:12px 0}
.kv{display:flex;justify-content:space-between;font-size:.8rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:none}
.kv b{font-weight:600}
.menu-table{width:100%;border-collapse:collapse;font-size:.76rem}
.menu-table th,.menu-table td{border:1px solid var(--line);padding:6px 4px;text-align:center}
.menu-table th{background:var(--mint-light);color:var(--mint-dark);font-weight:600}
.week-pill{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.week-pill button{flex:none;border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px;font-size:.78rem;color:var(--sub)}
.week-pill button.on{background:var(--mint);color:#fff;border-color:var(--mint)}
.course-item{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;align-items:center}
.course-item .lock{font-size:1.1rem;flex:none;width:34px;text-align:center}
.course-item.open{border-color:var(--mint);background:var(--mint-light)}

/* iOS 质感分段控件 */
.seg{position:relative;display:flex;background:#E7F0ED;border-radius:11px;padding:2.5px;overflow:hidden}
.seg button{flex:1;position:relative;z-index:1;padding:7px 0;font-size:.82rem;color:var(--sub);border-radius:8.5px;transition:color .25s;font-weight:500}
.seg button.on{color:var(--ink);font-weight:600}
.seg-thumb{position:absolute;top:2.5px;bottom:2.5px;left:2.5px;border-radius:8.5px;background:#fff;box-shadow:0 2.5px 7px rgba(25,60,52,.16),0 0 1px rgba(25,60,52,.1);transition:transform .3s cubic-bezier(.32,.72,.24,1),width .3s cubic-bezier(.32,.72,.24,1)}

/* 目标进度条 */
.goal-bar{height:8px;border-radius:6px;background:#E7F0ED;overflow:hidden;margin:10px 0 6px}
.goal-bar>div{height:100%;border-radius:6px;background:linear-gradient(90deg,#2BB5A0,#5AD6BF);transition:width .5s cubic-bezier(.32,.72,.24,1)}

/* 科普与活动 */
.sci-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sci-item:last-child{border-bottom:none}
.ev-card{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:#fff}
.ev-card .poster{width:100%;height:150px;object-fit:cover;display:block}
.ev-card .ev-body{padding:12px 14px}
.ev-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.72rem;color:var(--sub);margin-top:6px}
.pill-ok{background:var(--mint-light);color:var(--mint-dark);border-radius:20px;padding:2px 10px;font-size:.68rem}
.pill-warn{background:#FDF0E4;color:var(--warn);border-radius:20px;padding:2px 10px;font-size:.68rem}

/* 阶段性小目标 */
.ms-row{display:flex;gap:8px;margin-top:10px}
.ms-chip{flex:1;text-align:center;border:1px dashed var(--line);border-radius:12px;padding:8px 2px;font-size:.66rem;color:var(--sub);background:#FBFDFC}
.ms-chip b{display:block;font-size:.78rem;color:var(--ink);margin-top:2px}
.ms-chip.done{border:1px solid var(--mint);background:var(--mint-light);color:var(--mint-dark)}
.ms-chip.done b{color:var(--mint-dark)}

/* 购药记录（电商订单风） */
.order-item{display:flex;gap:10px;background:#fff;border-radius:14px;border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.order-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#F7FBF9;border-bottom:1px solid var(--line);font-size:.78rem}
.order-body{display:flex;gap:12px;padding:12px 14px;align-items:center}
.order-body .thumb{width:56px;height:56px;border-radius:10px;flex:none;border:1px solid var(--line)}
.order-foot{display:flex;justify-content:space-between;padding:9px 14px;border-top:1px dashed var(--line);font-size:.68rem;color:var(--sub)}

/* 积分商城 */
.mall-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mall-item:last-child{border-bottom:none}
.mall-item .mi-ico{width:52px;height:52px;border-radius:12px;background:var(--mint-light);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex:none}

/* ==================== 附近药房地图（自公众端 qingying.html v3.0 原样移植，2026-11-07） ==================== */
/* 真实地图瓦片（高德） */
#osm-map{position:relative;height:300px;border-radius:10px;overflow:hidden;background:#E8F0EE;
  touch-action:none;user-select:none;-webkit-user-select:none}
#map-layer{position:absolute;left:0;top:0;right:0;bottom:0;will-change:transform}
#osm-map .tile{position:absolute;width:256px;height:256px;pointer-events:none}
#pan-reset{position:absolute;right:8px;bottom:22px;z-index:30;display:none;width:38px;height:38px;border-radius:50%;
  background:#fff;border:1px solid #E3EAE7;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:1.05rem;color:var(--mint-dark)}
#pan-hint{position:absolute;left:8px;bottom:22px;z-index:6;font-size:.62rem;color:#5C6B66;
  background:rgba(255,255,255,.85);padding:2px 7px;border-radius:9px;pointer-events:none}
#osm-map .mk{position:absolute;transform:translate(-50%,-100%);cursor:pointer;line-height:0;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
#osm-map .mk.sel svg path{fill:#F2A93A}
.ph-pop{position:absolute;z-index:20;width:238px;max-height:226px;overflow:auto;background:#fff;border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.28);padding:12px 14px;font-size:.74rem;color:var(--ink);
  transform:translate(-50%,calc(-100% - 16px))}
.ph-pop.below{transform:translate(-50%,20px)}
.ph-pop:after{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
  border:8px solid transparent;border-top-color:#fff;border-bottom:none}
.ph-pop.below:after{bottom:auto;top:-8px;border-top:none;border-bottom-color:#fff;border-bottom:8px solid #fff}
.ph-pop .pp-nm{font-weight:700;font-size:.85rem;margin-bottom:4px;padding-right:18px}
.ph-pop .pp-row{color:var(--sub);line-height:1.6;margin-top:2px}
.ph-pop .pp-close{position:absolute;right:8px;top:6px;color:var(--sub);font-size:.95rem;padding:2px 6px}
.ph-pop .pp-stock{display:inline-block;font-size:.68rem;padding:1px 8px;border-radius:10px;margin-top:5px}
.ph-pop .pp-stock.yes{background:var(--mint-light);color:var(--mint-dark)}
.ph-pop .pp-stock.no{background:#FDECEC;color:var(--red)}
#osm-map .me-dot{position:absolute;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;
  background:#E5484D;border:3px solid #fff;box-shadow:0 0 0 5px rgba(229,72,77,.28);z-index:4}
#osm-map .me-dot:after{content:'我';position:absolute;left:50%;top:-19px;transform:translateX(-50%);
  font-size:10px;font-weight:700;color:#E5484D;background:rgba(255,255,255,.92);border-radius:8px;
  padding:0 6px;line-height:15px;border:1px solid rgba(229,72,77,.35)}
.osm-attrib{position:absolute;right:3px;bottom:2px;font-size:9px;color:#555;background:rgba(255,255,255,.75);
  padding:1px 4px;border-radius:3px;z-index:5}
#osm-map .lm{position:absolute;transform:translate(-50%,-130%);background:rgba(255,255,255,.88);
  color:#5C6B66;font-size:9px;padding:1px 5px;border-radius:3px;white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,.15);pointer-events:none}
.map-wrap{background:#fff;border-radius:var(--card-r);box-shadow:0 2px 10px rgba(30,156,137,.06);padding:10px;margin-bottom:12px}
.dist-tabs{display:flex;gap:8px;margin-bottom:10px}
.dist-tabs button{flex:1;border:1.5px solid var(--line);border-radius:18px;padding:6px 0;font-size:.8rem;color:var(--sub);background:#fff}
.dist-tabs button.on{background:var(--mint);border-color:var(--mint);color:#fff;font-weight:700}
.dist-tabs button:active{transform:scale(.95)}
.ph-item .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ph-item .nm{font-size:.92rem;font-weight:700}
.stock{font-size:.7rem;padding:2px 8px;border-radius:12px}
.stock.yes{background:var(--mint-light);color:var(--mint-dark)}
.stock.no{background:#FDECEC;color:var(--red)}
.ph-item .addr{font-size:.78rem;color:var(--sub);line-height:1.5}
.ph-item .tel{font-size:.78rem;color:var(--mint-dark);margin-top:4px}
.section-title{font-size:1.02rem;font-weight:800;color:var(--ink);margin:2px 0 10px}

/* ===== iOS 风格点击质感（三端统一：轻微按压，不夸张） ===== */
html{touch-action:manipulation}
:root{--spring:cubic-bezier(.34,1.56,.64,1)}
.btn,.chip,.svc-grid button,.list-item,.sci-item,.ev-card,.course-item,
.week-pill button,.tabbar button{transition:transform .3s var(--spring),opacity .18s ease,background .18s ease,border-color .18s ease}
.btn:active{transform:scale(.96);opacity:.9}
.chip:active,.week-pill button:active{transform:scale(.95)}
.svc-grid button:active{transform:scale(.94);background:var(--mint-light)}
.list-item:active,.sci-item:active{background:#F6FBF9;border-radius:10px}
.ev-card:active,.course-item:active{transform:scale(.98)}
.tabbar button:active{transform:scale(.9);opacity:.7}
.tabbar button.on .ico{animation:tabPop .45s var(--spring)}
@keyframes tabPop{0%{transform:scale(.6)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<script>
'use strict';
/* ==================== 工具 ==================== */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){/* 预览环境存储被禁用时静默降级为内存态 */}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
/* 三端统一入口：线上走 GitHub Pages，本地调试走同目录别名文件 */
const LINKS={
  public:'https://lightvia.github.io/lightfirst/',
  patient:'https://lightvia.github.io/lingyi-weixian/',
  doctor:'https://lightvia.github.io/viadoctor/'
};
function appUrl(which){
  const localNames={public:'qingying.html',patient:'weixian.html',doctor:'doctor.html'};
  const local=location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  return local?new URL(localNames[which],location.href).href:LINKS[which];
}

function genColdChain(seed){
  const pts=[];let t=3.6+seed*0.2;
  for(let i=0;i<44;i++){t+=(Math.sin(i*0.7+seed)*0.55)+(Math.random()-0.5)*0.4;t=Math.max(1.2,Math.min(6.4,t));pts.push(Math.round(t*10)/10)}
  return pts;
}

 {id:1,tag:'用药教育',date:'2026-11-03',from:'doc',title:'起始期胃肠不适怎么办？看懂身体的适应节奏',
  digest:'用药初期出现一过性恶心、食欲下降并不少见，多数会在数周内逐渐缓解。这篇文章帮你分清「正常适应」和「需要就医」的信号。',
  body:['许多患者在起始阶段会经历一过性的胃肠反应，比如恶心、腹胀、食欲下降。这在多数情况下是身体正在适应的正常过程，通常在数周内逐渐减轻。','可以尝试这些小方法：少量多餐，避免一次吃得太饱；暂时减少油腻、辛辣食物；保证充足饮水；记录不适出现的时间与程度，复诊时带给医生参考。','但请特别注意以下信号：剧烈或持续的腹痛、无法缓解的呕吐、明显脱水，或任何严重过敏表现。出现这些情况请及时就医，不要自行调整用药方案。','请记住：任何剂量调整都应由您的主治医生决定。规律记录、按时复诊，是安全用药的重要保障。']},
 {id:2,tag:'体重管理',date:'2026-10-28',from:'doc',title:'平台期不等于失败：如何读懂你的体重曲线',
  digest:'体重下降从来不是一条直线。看懂波动背后的原因，才能坚持下去。',
  body:['体重曲线出现平缓甚至小幅回升，是减重过程中非常常见的现象，我们称之为「平台期」。它不代表你的努力失效了。','体重每天受水分、进食、排便、运动等多重因素影响，单日波动 0.5-1kg 都很正常。比起每天盯数字，周平均值的趋势更有参考价值。','遇到平台期可以做的：回顾近期的饮食记录，看看是否有隐藏的「热量漏洞」；调整运动种类与强度，给身体新的刺激；保证睡眠，管理压力。','如果你的曲线连续 3-4 周完全没有变化，建议带着记录去复诊，和医生一起分析原因、调整方案。']},
 {id:3,tag:'生活方式',date:'2026-10-20',from:'doc',title:'秋冬交替的三个生活小调整',
  digest:'天气转凉，食欲、运动量和作息都在悄悄变化。提前做三个小调整，稳住节律。',
  body:['天气变冷后，身体本能地渴望更多热量，户外活动也相应减少。这是自然的季节节律，提前做好准备就能从容应对。','第一，调整运动计划：把户外快走换成室内操课、游泳或爬楼，保持每周运动总量不变。第二，安排「暖身加餐」：一杯无糖热豆浆或一小把坚果，比高糖点心更能稳定食欲。','第三，关注睡眠节律：日照变短容易影响情绪和作息，尽量保持固定的入睡时间，晚间减少屏幕时间。','小调整、稳执行，就是最好的坚持。']}

/* 演示用初始记录（建档后若无记录则生成约 3 个月，趋势：体重-10kg、腰围-10cm） */
function seedRecords(){
  if(S.records.length)return;
  const wEnd=S.profile?+S.profile.weight||78:78, wStart=wEnd+7;   /* 初始 85kg → 当前 78kg */
  const sEnd=S.profile?+S.profile.waist||80:80, sStart=sEnd+15;   /* 初始 95cm → 当前 80cm */
  for(let i=59;i>=0;i--){   /* 近 2 个月 */
    const d=addDays(new Date(),-i),p=(59-i)/59;
    S.records.push({
      date:fmt(d),
      weight:Math.round((wStart-(wStart-wEnd)*p+Math.sin(i*1.3)*0.35+(i%9===4?0.5:0))*10)/10,
      waist:Math.round(sStart-(sStart-sEnd)*p+Math.sin(i*0.9)*0.3)
    });
  }
  const monday=addDays(new Date(),-((new Date().getDay()+6)%7));   /* 最近一个周一 */
  for(let i=8;i>=0;i--){ /* 规律每周一使用 A药 0.25mg，约 2 个月 */
    const d=addDays(monday,-i*7);
    S.meds.push({date:fmt(d),time:'20:00',drug:'A药',dose:'0.25 mg',note:i===5?'注射后轻微恶心，次日缓解':(i===2?'正常，无不适':'')});
  }
  saveRecords();
}

/* 随访同步：只写入同源 localStorage，不向医生弹消息；授权字段逐项裁剪 */
function followupDayGap(date,now){
  if(!date||!now)return null;
  const t=new Date(date+'T00:00:00').getTime(),n=new Date(now).getTime();
  return Number.isFinite(t)&&Number.isFinite(n)?Math.max(0,Math.floor((n-t)/864e5)):null;
}
function buildFollowup(records,meds,share,now=new Date()){
  const allowed={weight:!!(share&&share.weight),waist:!!(share&&share.waist),med:!!(share&&share.med)};
  const cleanRecords=(Array.isArray(records)?records:[]).filter(r=>r&&r.date).map(r=>{
    const out={date:r.date};
    if(allowed.weight&&Number.isFinite(Number(r.weight))&&r.weight!=null)out.weight=Number(r.weight);
    if(allowed.waist&&Number.isFinite(Number(r.waist))&&r.waist!=null)out.waist=Number(r.waist);
    return out;
  }).filter(r=>r.weight!=null||r.waist!=null).sort((a,b)=>a.date.localeCompare(b.date));
  const cleanMeds=allowed.med?(Array.isArray(meds)?meds:[]).filter(m=>m&&m.date).map(m=>({date:m.date,time:m.time||'',drug:m.drug||'',dose:m.dose||'',note:m.note||''})).sort((a,b)=>(a.date+' '+a.time).localeCompare(b.date+' '+b.time)):[];
  const recordGap=cleanRecords.length?followupDayGap(cleanRecords[cleanRecords.length-1].date,now):null;
  const medGap=allowed.med&&cleanMeds.length?followupDayGap(cleanMeds[cleanMeds.length-1].date,now):null;
  let adherence=null;
  if(allowed.med){
    const since=new Date(now).getTime()-55*864e5,weeks=new Set();
    cleanMeds.forEach(m=>{const t=new Date(m.date+'T00:00:00').getTime();if(t>=since&&t<=new Date(now).getTime()){const d=new Date(t);d.setDate(d.getDate()-((d.getDay()+6)%7));weeks.add(todayStr(d))}});
    adherence=Math.min(100,Math.round(weeks.size/8*100));
  }
  const warnings=[];
  if(allowed.med&&(medGap==null||medGap>=11))warnings.push(medGap==null?'暂无用药记录，建议随访确认':'已 '+medGap+' 天未记录用药，超过每周计划间隔 1.5 倍');
  if((allowed.weight||allowed.waist)&&(recordGap==null||recordGap>=7))warnings.push(recordGap==null?'暂无已授权的体重或腰围随访记录':'已 '+recordGap+' 天未记录体重或腰围，随访记录断档');
  return {version:1,syncedAt:new Date(now).toISOString(),share:allowed,records:cleanRecords,meds:cleanMeds,recordGap,medGap,adherence,warnings};
}
function syncFollowup(){
  if(!S.profile||!S.doctor)return;
  const patients=LS.get('XYWX_doctor_patients',[]),list=Array.isArray(patients)?patients:[];
  const followup=buildFollowup(S.records,S.meds,S.share),index=list.findIndex(p=>p&&p.pid===S.profile.pid);
  const base=index>=0?list[index]:{};
  const patient=Object.assign({},base,{pid:S.profile.pid,name:S.profile.nick,age:S.profile.age,bmi:bmiNow(),weeksOn:weeksOn(),doctor:S.doctor.code,followup,lastRecord:followup.recordGap,medGap:followup.medGap,adherence:followup.adherence,warnings:followup.warnings,status:followup.warnings.length?'warning':'active',syncedAt:followup.syncedAt});
  if(index>=0)list[index]=patient;else list.push(patient);
  LS.set('XYWX_doctor_patients',list);
}

/* 目标进度：已达成 %、距目标剩余量、按最近趋势预估达成天数 */
function goalInfo(metric){
  const g=S.goals,target=g?g[metric]:null;
  if(target==null)return null;
  const recs=S.records.filter(r=>r[metric]!=null);
  if(!recs.length)return null;
  const start=recs[0][metric],now=recs[recs.length-1][metric];
  const denom=start-target;if(!denom)return null;
  const pct=Math.max(0,Math.min(100,Math.round((start-now)/denom*100)));
  const remain=Math.round(Math.abs(now-target)*10)/10;
  let days=null;
  const seg=recs.slice(-7);
  if(seg.length>=2){
    const dd=(new Date(seg[seg.length-1].date)-new Date(seg[0].date))/864e5;
    if(dd>0){const slope=(seg[0][metric]-seg[seg.length-1][metric])/dd; /* 每自然日下降量 */
      if(slope>0.001&&now>target)days=Math.ceil((now-target)/slope)}
  }
  return {start,now,target,pct,remain,done:now<=target,days};
}

function stopScanner(){
  SCAN_SESSION++;   /* 使所有悬挂的 await 恢复后失效，防止取消后迟到的降级动画弹出 */
  if(SCAN_TIMER){clearTimeout(SCAN_TIMER);SCAN_TIMER=0}

/* 解析扫码文本：支持纯编码、带参数的 URL、编码子串 */
function parseScanCode(kind,text){
  const t=(text||'').trim();
  if(!t)return null;
  if(kind==='box'){
    if(boxByCode(t))return t;
    const m=t.match(/[?&]box=([A-Za-z0-9-]+)/);if(m&&boxByCode(m[1]))return m[1];
    const m2=t.match(/BOX-\d{4}-\d{4}/);if(m2&&boxByCode(m2[0]))return m2[0];
  }else{
    const up=t.toUpperCase();
    if(DOCTORS.find(x=>x.code===up))return up;
    const m=t.match(/[?&]doc=(DR-[A-Za-z0-9-]+)/i);
    if(m){const c=m[1].toUpperCase();if(DOCTORS.find(x=>x.code===c))return c}
    const m2=t.match(/DR-\d{4}-\d{4}/i);
    if(m2){const c=m2[0].toUpperCase();if(DOCTORS.find(x=>x.code===c))return c}
  }
  return null;
}

let _jsqrPromise=null;
function loadJsQR(){   /* BarcodeDetector 不可用时，CDN 加载 jsQR 兜底解码 */
  if(window.jsQR)return Promise.resolve();
  if(_jsqrPromise)return _jsqrPromise;
  _jsqrPromise=new Promise((res,rej)=>{
    const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    sc.onload=()=>window.jsQR?res():rej(new Error('jsQR unavailable'));
    sc.onerror=()=>rej(new Error('jsQR load failed'));
    document.head.appendChild(sc);
    setTimeout(()=>rej(new Error('jsQR timeout')),8000);
  });
  return _jsqrPromise;
}
async function openScanner(kind){
  if(kind==='box'){simulateScan('box','演示环境无真实药盒');return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){simulateScan(kind,'当前环境不支持相机');return}
  const session=++SCAN_SESSION;
  openModal(`<h3 style="margin-bottom:10px">扫描医生绑定码</h3>
    <div class="scan-box" style="width:100%;height:260px">
      <video id="scan-video" autoplay playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>
      <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
      <div class="scan-line"></div>
      <div class="scan-txt" id="scan-status">正在启动相机…</div>
    </div>
    <p class="tiny" style="text-align:center;margin:8px 0">对准医生端「我的绑定码」二维码，识别成功自动进入下一步</p>
    <button class="btn ghost" onclick="simulateScan('doc','已手动切换')">改用模拟扫码（演示）</button>
    <button class="btn gray" style="margin-top:8px" onclick="stopScanner();closeModal()">取消</button>`,true);
  try{
    SCAN_STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  }catch(e){
    if(session!==SCAN_SESSION)return;   /* 用户已取消，不再降级弹动画 */
    const reason=(e&&e.name==='NotAllowedError')?'未获得相机权限':((e&&e.name==='NotFoundError')?'未检测到可用相机':'相机启动失败');
    simulateScan(kind,reason);return;
  }
  if(session!==SCAN_SESSION){stopScanner();return}   /* 等待相机期间用户已取消：关闭迟到的流 */
  const v=$('#scan-video');
  if(!v){stopScanner();return}
  v.srcObject=SCAN_STREAM;try{await v.play()}catch(e){}
  const st=$('#scan-status');if(st)st.textContent='对准二维码，保持平稳';
  let detector=null;
  if('BarcodeDetector' in window){
    try{detector=new BarcodeDetector({formats:['qr_code','code_128','data_matrix']})}
    catch(e){try{detector=new BarcodeDetector()}catch(e2){}}
  }
  if(!detector){
    try{await loadJsQR()}catch(e){
      if(session!==SCAN_SESSION)return;   /* 用户已取消（含 jsQR 8 秒超时迟到），不再降级弹动画 */
      simulateScan(kind,'当前浏览器不支持扫码识别');return
    }
  }
  if(session!==SCAN_SESSION){stopScanner();return}
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});
  let lastMiss=0;
  const tick=async()=>{
    if(session!==SCAN_SESSION||!SCAN_STREAM)return;
    if(v.readyState>=2&&v.videoWidth){
      try{
        let text=null;
        if(detector){
          const codes=await detector.detect(v);
          if(codes&&codes.length)text=codes[0].rawValue;
        }else{
          cv.width=v.videoWidth;cv.height=v.videoHeight;ctx.drawImage(v,0,0);
          const img=ctx.getImageData(0,0,cv.width,cv.height);
          const code=window.jsQR&&window.jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
          if(code&&code.data)text=code.data;
        }
        if(text){
          const code=parseScanCode(kind,text);
          if(code){stopScanner();closeModal();onScanSuccess(kind,code);return}
          const now=Date.now();
          if(now-lastMiss>2500){lastMiss=now;toast('未识别为有效'+(kind==='box'?'药盒码':'医生绑定码')+'，请重新对准')}
        }
      }catch(e){}
    }
    if(session!==SCAN_SESSION)return;   /* 解码期间用户已取消：不得重排 tick */
    SCAN_TIMER=setTimeout(tick,280);
  };
  tick();
}

/* ==================== 通用图表（原生 Canvas） ==================== */
function setupCanvas(cv,h=180){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth||cv.parentElement.clientWidth-20;
  cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);return[ctx,w,h];
}
function lineChart(cv,{labels,data,unit='',min=null,max=null,marks=[],band=null,noteCb=null,color='#2BB5A0',goal=null}){
  const[ctx,W,H]=setupCanvas(cv);
  const pad={l:36,r:10,t:14,b:24};
  let lo=min!=null?min:Math.min(...data)*0.98,hi=max!=null?max:Math.max(...data)*1.02;
  if(hi===lo){hi+=1;lo-=1}
  if(band){lo=Math.min(lo,band[0]);hi=Math.max(hi,band[1])}
  if(goal!=null){lo=Math.min(lo,goal);hi=Math.max(hi,goal)}
  const x=i=>pad.l+(W-pad.l-pad.r)*(i/(data.length-1||1));
  const y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-lo)/(hi-lo));
  ctx.strokeStyle='#E3EFEA';ctx.fillStyle='#8CA39D';ctx.font='10px sans-serif';ctx.textAlign='right';
  for(let g=0;g<=4;g++){const v=lo+(hi-lo)*g/4,yy=y(v);
    ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(W-pad.r,yy);ctx.stroke();
    ctx.fillText((band? v.toFixed(0):v.toFixed(1))+ (unit&&g===4?' '+unit:''),pad.l-5,yy+3)}
  if(band){ctx.fillStyle='rgba(43,181,160,.10)';ctx.fillRect(pad.l,y(band[1]),W-pad.l-pad.r,y(band[0])-y(band[1]));
    ctx.fillStyle='#2BB5A0';ctx.textAlign='left';ctx.fillText('2-8℃ 标准区间',pad.l+4,y(band[1])+12)}
  if(goal!=null){ctx.strokeStyle='rgba(232,131,58,.9)';ctx.setLineDash([6,4]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(pad.l,y(goal));ctx.lineTo(W-pad.r,y(goal));ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=2;
    ctx.fillStyle='#E8833A';ctx.textAlign='left';ctx.fillText('目标 '+goal+unit,pad.l+5,y(goal)-5)}
  marks.forEach(m=>{ctx.strokeStyle='rgba(232,131,58,.8)';ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(x(m.i),pad.t);ctx.lineTo(x(m.i),H-pad.b);ctx.stroke();ctx.setLineDash([])});
  if(!band&&data.length>1){ /* 趋势面积渐变 */
    ctx.save();ctx.beginPath();
    data.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(0),y(v)));
    ctx.lineTo(x(data.length-1),H-pad.b);ctx.lineTo(x(0),H-pad.b);ctx.closePath();
    const g=ctx.createLinearGradient(0,pad.t,0,H-pad.b);
    g.addColorStop(0,color+'30');g.addColorStop(1,color+'05');
    ctx.fillStyle=g;ctx.fill();ctx.restore()}
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
  data.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(0),y(v)));ctx.stroke();
  ctx.fillStyle=color;data.forEach((v,i)=>{ctx.beginPath();ctx.arc(x(i),y(v),2.4,0,7);ctx.fill()});
  ctx.fillStyle='#8CA39D';ctx.textAlign='center';
  const step=Math.ceil(labels.length/6);
  labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)ctx.fillText(l,x(i),H-8)});
  if(noteCb)cv._note=noteCb;
}

/* ==================== 记录图表引擎（v1.4：最高点上1/5+目标线1/4双锚点 / 倒楔形用药标记 / rAF顺滑拖拽 / 同日去重） ==================== */
let SEL_POINT=null, REC_OFF=0;
const REC_WIN_DAYS={day:30,week:56,month:180};   // 日=30天 周=8周 月=6个月 可视窗口
function dedupeRecords(){   // 同一天仅保留一条记录（体重/腰围合并），消除重复无意义记录点
  const m={};
  S.records.forEach(r=>{if(!r||!r.date)return;const k=r.date;
    if(!m[k])m[k]={date:k};
    if(r.weight!=null)m[k].weight=r.weight;
    if(r.waist!=null)m[k].waist=r.waist});
  S.records=Object.keys(m).sort().map(k=>m[k]);
}
function recSeries(){
  dedupeRecords();
  const metric=REC_METRIC,pts=[];
  if(REC_MODE==='day'){
    S.records.forEach(r=>{if(r[metric]!=null)pts.push({date:r.date,v:r[metric]})});
  }else if(REC_MODE==='week'){
    const bk={};
    S.records.forEach(r=>{if(r[metric]==null)return;
      const d=new Date(r.date+'T00:00:00'),ws=new Date(d);
      ws.setDate(d.getDate()-((d.getDay()+6)%7));   // 周一为一周起点
      const k=fmt(ws);(bk[k]=bk[k]||[]).push(r[metric])});
    Object.keys(bk).sort().forEach(k=>pts.push({date:k,v:bk[k].reduce((a,b)=>a+b,0)/bk[k].length}));
  }else{
    const bk={};
    S.records.forEach(r=>{if(r[metric]==null)return;const k=r.date.slice(0,7)+'-01';(bk[k]=bk[k]||[]).push(r[metric])});
    Object.keys(bk).sort().forEach(k=>pts.push({date:k,v:bk[k].reduce((a,b)=>a+b,0)/bk[k].length}));
  }
  return pts.sort((a,b)=>a.date<b.date?-1:1);
}
function recView(){
  const pts=recSeries();
  if(!pts.length)return{pts:[]};
  const first=pts[0].date,today=todayStr();
  const span=Math.round((new Date(today)-new Date(first))/864e5);
  const win=REC_WIN_DAYS[REC_MODE];
  let start=first,end=today,canPan=false;
  if(span>win){canPan=true;
    REC_OFF=Math.max(0,Math.min(REC_OFF,span-win));
    const e=new Date(today);e.setDate(e.getDate()-REC_OFF);
    const s=new Date(e);s.setDate(s.getDate()-win);
    end=fmt(e);start=fmt(s);
  }else REC_OFF=0;
  return{pts,first,today,start,end,canPan,win,span};
}
function drawRecord(light){
  const cv=$('#rec-chart');if(!cv)return;
  const metric=REC_METRIC,u=METRIC_UNIT[metric],color=metric==='weight'?'#2BB5A0':'#3E7BFA';
  const tip=$('#rec-tip'),del=$('#rec-del'),winEl=$('#rec-win'),hintEl=$('#rec-pan-hint');
  SEL_POINT=null;if(del)del.classList.add('hide');
  const V=recView();
  if(!V.pts.length){cv.style.display='none';if(tip)tip.textContent='暂无'+METRIC_NAME[metric]+'记录，可先补录数据';if(winEl)winEl.textContent='';if(hintEl)hintEl.textContent='';return}
  cv.style.display='block';
  if(winEl)winEl.textContent=`${V.start} ~ ${V.end}`;
  if(hintEl)hintEl.textContent=V.canPan?'🖐 左右拖动查看全部记录':'';
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth||320,H=216;
  if(!light||cv._w!==W||cv._h!==H){cv.width=W*dpr;cv.height=H*dpr;cv._w=W;cv._h=H;cv.getContext('2d').scale(dpr,dpr)}
  const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H);
  const pad={l:40,r:12,t:32,b:26},pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  const x0=new Date(V.start+'T00:00:00').getTime(),spanMs=Math.max(1,new Date(V.end+'T00:00:00').getTime()-x0);
  const X=date=>pad.l+pw*((new Date(date+'T00:00:00').getTime()-x0)/spanMs);
  const vis=V.pts.filter(p=>p.date>=V.start&&p.date<=V.end);
  if(!vis.length){ctx.fillStyle='#8CA39D';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('该时间段暂无记录，可拖动查看其他时间',W/2,H/2);cv._pts=[];cv._meds=[];return}
  /* 纵轴双锚点：最高记录点位于上 1/5，目标线位于下 1/4；整数间距网格 */
  const gi=goalInfo(metric);
  const dMax=Math.max(...vis.map(p=>p.v)),dMin=Math.min(...vis.map(p=>p.v));
  let lo,hi;
  if(gi&&dMax>gi.target){
    let R=(dMax-gi.target)/0.55;                 // dMax→1/5 高度，target→3/4 高度
    if(R<4)R=4;
    lo=gi.target-0.25*R;hi=lo+R;
  }else if(gi){hi=Math.ceil(dMax*1.05);lo=(gi.target-0.25*hi)/0.75}
  else{hi=Math.ceil(dMax);lo=Math.floor(dMin);if(hi<=lo){hi=lo+2}}
  if(dMin<lo)lo=Math.floor(dMin);
  const Y=v=>pad.t+ph*(1-(v-lo)/(hi-lo));
  const step=[0.5,1,2,5,10,20,50].find(s=>(hi-lo)/s<=6)||100;
  ctx.font='10px sans-serif';
  for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step){
    const yy=Y(v);
    ctx.strokeStyle='#E9F2EF';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(W-pad.r,yy);ctx.stroke();
    ctx.fillStyle='#8CA39D';ctx.textAlign='right';
    ctx.fillText(String(Math.round(v*10)/10),pad.l-5,yy+3);
  }
  /* 横轴：按日期均匀取 5~7 个刻度 */
  const dayStep=[1,2,5,7,10,14,30,60,90].find(s=>spanMs/864e5/s<=7)||120;
  ctx.textAlign='center';ctx.fillStyle='#8CA39D';
  const tick0=Math.ceil(x0/864e5/dayStep)*dayStep*864e5;
  for(let t=tick0;t<=x0+spanMs;t+=dayStep*864e5){
    const d=new Date(t),lab=REC_MODE==='month'?`${d.getMonth()+1}月`:`${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const xx=pad.l+pw*((t-x0)/spanMs);
    ctx.strokeStyle='#DDEAE5';ctx.beginPath();ctx.moveTo(xx,pad.t);ctx.lineTo(xx,H-pad.b);ctx.stroke();
    if(xx>pad.l+14&&xx<W-pad.r-10)ctx.fillText(lab,xx,H-8);
  }
  /* 目标线（下 1/4 基准） */
  if(gi){
    const gy=Y(gi.target);
    ctx.strokeStyle='rgba(232,131,58,.9)';ctx.setLineDash([6,4]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(W-pad.r,gy);ctx.stroke();
    ctx.setLineDash([]);ctx.lineWidth=1;
    ctx.fillStyle='#E8833A';ctx.textAlign='left';
    ctx.fillText(`目标 ${gi.target}${u}`,pad.l+4,gy-5);
  }
  /* 记录线（渐变面积 + 折线 + 圆点） */
  const pts2=vis.map(p=>({x:X(p.date),y:Y(p.v),date:p.date,v:p.v}));
  if(pts2.length>1){
    ctx.save();ctx.beginPath();
    pts2.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.lineTo(pts2[pts2.length-1].x,H-pad.b);ctx.lineTo(pts2[0].x,H-pad.b);ctx.closePath();
    const g=ctx.createLinearGradient(0,pad.t,0,H-pad.b);
    g.addColorStop(0,color+'30');g.addColorStop(1,color+'05');
    ctx.fillStyle=g;ctx.fill();ctx.restore();
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();
    pts2.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  }
  ctx.lineWidth=1.5;ctx.strokeStyle='#fff';
  pts2.forEach(p=>{ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();ctx.stroke()});
  /* 用药时点标记：简化倒楔形 ▼ 标在折线上方，点按看详情（钳制在画布内保证全部可见可点） */
  cv._pts=pts2;
  cv._meds=[];
  S.meds.filter(m=>m.date>=V.start&&m.date<=V.end).forEach(m=>{
    const mx=X(m.date);
    const rec=S.records.find(r=>r.date===m.date);
    const baseY=rec&&rec[metric]!=null?Y(rec[metric]):pad.t+ph-4;
    const my=Math.max(pad.t+11,Math.min(baseY-26,pad.t+ph-12));
    ctx.strokeStyle='rgba(232,131,58,.55)';ctx.setLineDash([2,3]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(mx,baseY-6);ctx.lineTo(mx,my+5);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#E8833A';ctx.strokeStyle='#fff';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(mx-6,my-8);ctx.lineTo(mx+6,my-8);ctx.lineTo(mx,my+3);ctx.closePath();
    ctx.fill();ctx.stroke();
    cv._meds.push({x:mx,y:my-2,r:12,date:m.date});
  });
  /* 交互状态挂在 canvas 上，事件只绑定一次；rAF 平滑平移 */
  cv._win=V.win;cv._pw=pw;cv._wh=[W,H];cv._canPan=V.canPan;
  bindChartEvents(cv);
}
let _panSt=null,_panMoved=false,_rafId=0;
function bindChartEvents(cv){
  if(cv._bound)return;cv._bound=true;
  cv.addEventListener('pointerdown',e=>{_panSt={x:e.clientX,off:REC_OFF};_panMoved=false;
    if(_rafId){cancelAnimationFrame(_rafId);_rafId=0}});
  cv.addEventListener('pointermove',e=>{
    if(!_panSt)return;
    const dx=e.clientX-_panSt.x;
    if(Math.abs(dx)>10)_panMoved=true;             // 10px 起步，避免误吞点按
    if(!_panMoved||!cv._canPan||_rafId)return;
    const nx=e.clientX;
    _rafId=requestAnimationFrame(()=>{_rafId=0;
      if(!_panSt)return;
      REC_OFF=_panSt.off+(nx-_panSt.x)*(cv._win/cv._pw);
      drawRecord(true)});                          // 轻量重绘：不重置画布尺寸
  });
  const end=e=>{
    if(!_panSt)return;
    const moved=_panMoved,st=_panSt;_panSt=null;
    if(_rafId){cancelAnimationFrame(_rafId);_rafId=0}
    if(moved){                                    // 松手帧同步落定最终位置（快速拖动也不丢）
      if(cv._canPan){REC_OFF=st.off+(e.clientX-st.x)*(cv._win/cv._pw);drawRecord(true)}
      return;}
    const rect=cv.getBoundingClientRect();
    const px=(e.clientX-rect.left)*(cv._wh[0]/rect.width);
    const py=(e.clientY-rect.top)*(cv._wh[1]/rect.height);
    /* 优先命中用药标记（倒楔形） */
    const med=(cv._meds||[]).find(m=>Math.hypot(px-m.x,py-m.y)<=(m.r||12));
    if(med){const md=S.meds.find(x=>x.date===med.date);if(md){showMedDetail(md);return}}
    /* 其次命中数据点 */
    let best=null,bd=16;
    (cv._pts||[]).forEach(p=>{const d=Math.hypot(px-p.x,py-p.y);if(d<bd){bd=d;best=p}});
    if(best){const m2=REC_METRIC,u2=METRIC_UNIT[m2];
      SEL_POINT={date:best.date,metric:m2};
      const tipEl=$('#rec-tip');if(tipEl)tipEl.textContent=`${best.date}：${METRIC_NAME[m2]} ${best.v.toFixed(1)} ${u2}`;
      const delEl=$('#rec-del');if(delEl)delEl.classList.remove('hide');}
  };
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointercancel',()=>{_panSt=null;if(_rafId){cancelAnimationFrame(_rafId);_rafId=0}});
}

function havKm(lon1,lat1,lon2,lat2){
  const R=6371, dLa=(lat2-lat1)*Math.PI/180, dLo=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
PHARMACIES.forEach(p => { p.km = havKm(MAP_CENTER.lon, MAP_CENTER.lat, p.lon, p.lat); });

/* ---------- 地图：WGS84→GCJ-02 转换（对齐高德瓦片）、瓦片源、地标 ---------- */
const GCJ_A = 6378245.0, GCJ_EE = 0.00669342162296594323;
function gcjTransLat(x, y){
  let ret = -100.0 + 2.0*x + 3.0*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
  ret += (20.0*Math.sin(6.0*x*Math.PI) + 20.0*Math.sin(2.0*x*Math.PI)) * 2.0/3.0;
  ret += (20.0*Math.sin(y*Math.PI) + 40.0*Math.sin(y/3.0*Math.PI)) * 2.0/3.0;
  ret += (160.0*Math.sin(y/12.0*Math.PI) + 320.0*Math.sin(y*Math.PI/30.0)) * 2.0/3.0;
  return ret;
}
function gcjTransLon(x, y){
  let ret = 300.0 + x + 2.0*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
  ret += (20.0*Math.sin(6.0*x*Math.PI) + 20.0*Math.sin(2.0*x*Math.PI)) * 2.0/3.0;
  ret += (20.0*Math.sin(x*Math.PI) + 40.0*Math.sin(x/3.0*Math.PI)) * 2.0/3.0;
  ret += (150.0*Math.sin(x/12.0*Math.PI) + 300.0*Math.sin(x/30.0*Math.PI)) * 2.0/3.0;
  return ret;
}
function wgs2gcj(lon, lat){
  const dLat = gcjTransLat(lon-105.0, lat-35.0);
  const dLon = gcjTransLon(lon-105.0, lat-35.0);
  const radLat = lat/180.0*Math.PI;
  let magic = Math.sin(radLat); magic = 1 - GCJ_EE*magic*magic;
  const sqrtMagic = Math.sqrt(magic);
  return {
    lon: lon + (dLon*180.0)/(GCJ_A/sqrtMagic*Math.cos(radLat)*Math.PI),
    lat: lat + (dLat*180.0)/((GCJ_A*(1-GCJ_EE))/(magic*sqrtMagic)*Math.PI)
  };
}
/* 瓦片源：优先高德（国内可达、中文街道与 POI 标注），失败回退 OSM */
const TILE_SOURCES = [
  (z,x,y) => 'https://webst0'+((x+y)%4+1)+'.is.autonavi.com/appmaptile?style=7&x='+x+'&y='+y+'&z='+z,
  (z,x,y) => 'https://wprd0'+((x+y)%4+1)+'.is.autonavi.com/appmaptile?style=7&x='+x+'&y='+y+'&z='+z,
  (z,x,y) => 'https://tile.openstreetmap.org/'+z+'/'+x+'/'+y+'.png',
];
const KM_ZOOM = {1:15, 2:14, 4:13, 8:12};   // 公里数越小放大倍数越高、街道/建筑细节越精细
/* 合规要求：地图仅标注药房，不再显示非药房地标 */
const LANDMARKS = [];
let curKm = 2;
let panX = 0, panY = 0;   // 拖拽平移偏移（像素）
function setKm(km){
  curKm = km;
  panX = 0; panY = 0; updatePanBtn();
  document.querySelectorAll('#dist-tabs button').forEach(b=>
    b.classList.toggle('on', +b.dataset.km === km));
  renderMap(); renderPhList();
}
/* Web 墨卡托投影：经纬度 → 世界像素 */
function lonLatToPx(lon, lat, z){
  const n = Math.pow(2, z) * 256;
  const x = (lon + 180) / 360 * n;
  const la = lat * Math.PI / 180;
  const y = (1 - Math.log(Math.tan(la) + 1/Math.cos(la)) / Math.PI) / 2 * n;
  return {x, y};
}
function renderMap(){
  const map = document.getElementById('osm-map');
  const svg = document.getElementById('map-svg');
  const z = KM_ZOOM[curKm] || 15;
  const W = map.clientWidth || 340, H = 300;
  const gC = {lon:MAP_CENTER.lon, lat:MAP_CENTER.lat};   // 数据已是 GCJ-02，与高德瓦片一致
  const c = lonLatToPx(gC.lon, gC.lat, z);
  const ox = c.x - W/2 - panX, oy = c.y - H/2 - panY;
  const tx0 = Math.floor(ox/256), ty0 = Math.floor(oy/256);
  const cols = Math.ceil(W/256)+1, rows = Math.ceil(H/256)+1;
  let html = '';
  for(let r=0; r<rows; r++){
    for(let q=0; q<cols; q++){
      const tx = tx0+q, ty = ty0+r;
      html += `<img class="tile" data-tile data-src="0" data-z="${z}" data-x="${tx}" data-y="${ty}"
        src="${TILE_SOURCES[0](z,tx,ty)}" style="left:${tx*256-ox}px;top:${ty*256-oy}px" alt=""
        onerror="tileError(this)">`;
    }
  }
  // 药店定位图钉（点击弹出详情）；留大边距，拖入视野内即可见
  PHARMACIES.filter(p=>p.km<=curKm).forEach(p=>{
    const m = lonLatToPx(p.lon, p.lat, z);
    const left = m.x-ox, top = m.y-oy;
    if(left<-300||left>W+300||top<-260||top>H+260) return;
    html += `<div class="mk" id="mk-${p.id}" style="left:${left}px;top:${top}px" onclick="showPhDetail(${p.id},${left},${top})">
      <svg viewBox="0 0 24 24" width="34" height="34" style="filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))"><path d="M12 1.8C7.9 1.8 4.6 5.1 4.6 9.2c0 5.4 7.4 13.4 7.4 13.4s7.4-8 7.4-13.4C19.4 5.1 16.1 1.8 12 1.8z" fill="#2BB5A0" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="9.2" r="3.4" fill="#fff"/></svg></div>`;
  });
  // 地标建筑标注
  LANDMARKS.forEach(l=>{
    if(havKm(MAP_CENTER.lon, MAP_CENTER.lat, l.lon, l.lat) > curKm*1.15 + 0.3) return;
    const g = wgs2gcj(l.lon, l.lat);
    const m = lonLatToPx(g.lon, g.lat, z);
    const left = m.x-ox, top = m.y-oy;
    if(left<-40||left>W+40||top<-20||top>H+10) return;
    html += `<div class="lm" style="left:${left}px;top:${top}px">▲ ${l.n}</div>`;
  });
  // 我的定位点（随地图拖动，始终在真实地理位置上）
  html += `<div class="me-dot" style="left:${W/2+panX}px;top:${H/2+panY}px"></div>`;
  const layer = document.getElementById('map-layer');
  layer.querySelectorAll('[data-tile],.mk,.lm,.me-dot').forEach(el=>el.remove());
  layer.insertAdjacentHTML('beforeend', html);
  map.querySelector('.osm-attrib')?.remove();
  map.insertAdjacentHTML('beforeend', `<div class="osm-attrib">地图数据 © 高德地图 · 缩放 z${z}（约 ${curKm} km）</div>`);
  svg.style.display = 'none';
  updatePanBtn();
  // 全部瓦片源均失败 → 精细街道示意图兜底
  setTimeout(()=>{
    const tiles = map.querySelectorAll('img[data-tile]');
    let dead = 0; tiles.forEach(t=>{ if(t.dataset.dead === '1') dead++; });
    if(tiles.length && dead >= tiles.length){
      map.querySelectorAll('.mk,.lm,.me-dot,.osm-attrib,.ph-pop,img[data-tile]').forEach(el=>el.remove());
      schematicFallback(svg);
    }
  }, 4000);
}
/* 拖拽平移：拖动过程中只平移图层，松手后重绘瓦片 */
function updatePanBtn(){
  const b = document.getElementById('pan-reset'); if(!b) return;
  b.style.display = (panX || panY) ? 'block' : 'none';
}
function resetPan(){ panX = 0; panY = 0; renderMap(); updatePanBtn(); }
let mapDragBound = false;
function bindMapDrag(){
  if(mapDragBound) return; mapDragBound = true;
  const map = document.getElementById('osm-map');
  const layer = document.getElementById('map-layer');
  let sx=0, sy=0, dx=0, dy=0, active=false, moved=false;
  map.addEventListener('pointerdown', e=>{
    if(e.target.closest('.ph-pop,#pan-reset')) return;
    active = true; moved = false; sx = e.clientX; sy = e.clientY;
    /* 注意：此处不能 setPointerCapture，否则图钉上的 click 会被劫持到地图容器 */
  });
  map.addEventListener('pointermove', e=>{
    if(!active) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if(Math.abs(dx) + Math.abs(dy) > 8 && !moved){
      moved = true;
      try{ map.setPointerCapture(e.pointerId); }catch(err){}
    }
    if(moved) layer.style.transform = 'translate('+dx+'px,'+dy+'px)';
  });
  const end = ()=>{
    if(!active) return;
    active = false;
    if(!moved){ dx = dy = 0; return; }
    map.dataset.dragMoved = '1';           // 标记本次手势为拖动，抑制点击关闭
    setTimeout(()=>{ map.dataset.dragMoved = '0'; }, 350);
    panX += dx; panY += dy; dx = dy = 0;
    const z = KM_ZOOM[curKm] || 15;
    const mpp = 156543.03392 * Math.cos(MAP_CENTER.lat*Math.PI/180) / Math.pow(2, z);
    const maxPx = Math.max(curKm * 1000 / mpp * 1.2, 220);
    panX = Math.max(-maxPx, Math.min(maxPx, panX));
    panY = Math.max(-maxPx, Math.min(maxPx, panY));
    layer.style.transform = '';
    renderMap();
  };
  map.addEventListener('pointerup', end);
  map.addEventListener('pointercancel', end);
}
/* 单个瓦片逐级回退瓦片源 */
function tileError(el){
  const i = +el.dataset.src + 1;
  if(i < TILE_SOURCES.length){
    el.dataset.src = i;
    el.src = TILE_SOURCES[i](+el.dataset.z, +el.dataset.x, +el.dataset.y);
  }else{
    el.dataset.dead = '1';
    el.style.display = 'none';
  }
}
/* 兜底：带真实街道名 / 地标 / 药店的精细示意图 */
function schematicFallback(svg){
  const W = 492, H = 300, cx = W/2, cy = H/2;
  const pxPerKm = 115 / curKm * (curKm >= 4 ? 1.15 : 1);   // 让公里圈占画面主体
  const px = (lon, lat) => {
    const dxKm = (lon - MAP_CENTER.lon) * 94.9, dyKm = (lat - MAP_CENTER.lat) * 111.0;
    return [cx + dxKm*pxPerKm, cy - dyKm*pxPerKm];
  };
  let s = `<rect width="${W}" height="${H}" fill="#F4F6F5"/>`;
  // 街区底色
  for(let i=-2;i<8;i++)for(let j=-2;j<6;j++){
    if((i+j)%2===0) s += `<rect x="${i*70}" y="${j*70}" width="66" height="66" fill="#EDF2F0"/>`;
  }
  // 街道（东西向）
  const streetsH = [
    {lat:31.23520, n:'北京西路', w:7},
    {lat:31.23009, n:'南京西路', w:9},
    {lat:31.22700, n:'威海路', w:6},
    {lat:31.22210, n:'延安中路', w:8},
  ];
  streetsH.forEach(st=>{
    const [,y] = px(MAP_CENTER.lon, st.lat);
    if(y<-10||y>H+10) return;
    s += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#FFFFFF" stroke-width="${st.w}"/>
      <line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#D8DEDA" stroke-width="1"/>
      <text x="6" y="${y-4}" font-size="10" fill="#7A8A85">${st.n}</text>`;
  });
  // 街道（南北向）
  const streetsV = [
    {lon:121.44260, n:'常德路', w:5},
    {lon:121.44720, n:'西康路', w:6},
    {lon:121.45131, n:'江宁路', w:8},
    {lon:121.45490, n:'陕西北路', w:7},
    {lon:121.45871, n:'石门一路', w:6},
  ];
  streetsV.forEach(st=>{
    const [x] = px(st.lon, MAP_CENTER.lat);
    if(x<-10||x>W+10) return;
    s += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#FFFFFF" stroke-width="${st.w}"/>
      <line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#D8DEDA" stroke-width="1"/>
      <text x="${x+3}" y="${H-6}" font-size="10" fill="#7A8A85">${st.n}</text>`;
  });
  // 公里圈
  s += `<circle cx="${cx}" cy="${cy}" r="${pxPerKm*curKm}" fill="rgba(43,184,154,.07)"
    stroke="#2BB5A0" stroke-width="1.4" stroke-dasharray="5 5"/>`;
  // 地标
  LANDMARKS.forEach(l=>{
    const [x,y] = px(l.lon, l.lat);
    if(x<20||x>W-20||y<14||y>H-14) return;
    if(havKm(MAP_CENTER.lon, MAP_CENTER.lat, l.lon, l.lat) > curKm*1.2 + 0.4) return;
    s += `<rect x="${x-4}" y="${y-4}" width="8" height="8" fill="#C9B458"/>
      <text x="${x+7}" y="${y+4}" font-size="10" fill="#6B5D1F">${l.n}</text>`;
  });
  // 药店
  PHARMACIES.filter(p=>p.km<=curKm).forEach(p=>{
    const [x,y] = px(p.lon, p.lat);
    if(x<10||x>W-10||y<10||y>H-10) return;
    s += `<circle class="mk-svg" cx="${x}" cy="${y}" r="6" fill="${p.stock?'#2BB5A0':'#D9534F'}" stroke="#fff" stroke-width="2" style="cursor:pointer" onclick="showPhDetail('${p.id}',${x},${y},1)">
      <title>${p.name}</title></circle>`;
  });
  // 中心点
  s += `<circle cx="${cx}" cy="${cy}" r="8" fill="#1E9C82" stroke="#fff" stroke-width="3"/>
    <text x="${cx}" y="${cy+22}" font-size="11" text-anchor="middle" fill="#1E9C82">中信泰富广场（辉瑞上海总部）</text>
    <text x="${W-4}" y="${H-6}" font-size="9" text-anchor="end" fill="#9AA8A3">街道示意图（离线兜底）· 约 ${curKm} km</text>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = s;
  svg.style.display = 'block';
}

    x = m.x - c.x + W/2 + panX; y = m.y - c.y + H/2 + panY;
  }
  const left = Math.max(124, Math.min(W-124, x));
  const mk = document.getElementById('mk-'+id);
  if(mk) mk.classList.add('sel');
  const telHtml = /^0\d{2}-?/.test(p.tel)
    ? `<a href="tel:${p.tel}" style="color:var(--mint-dark);text-decoration:none">${p.tel}</a>`
    : p.tel;
  map.insertAdjacentHTML('beforeend', `<div class="ph-pop" style="left:${left}px;top:${Math.round(y)}px">
    <button class="pp-close" onclick="event.stopPropagation();closePhPop()">✕</button>
    <div class="pp-nm">${p.name}</div>
    <div class="pp-row">📍 ${p.addr}<br>距您约 ${p.km.toFixed(1)} km · 👨‍⚕️ ${p.pharmacist}</div>
    <div class="pp-row">📞 ${telHtml}</div>
    <span class="pp-stock ${p.stock?'yes':'no'}">GLP-1 类药品：${p.stock?'有货':'缺货'}</span>
    <button class="btn" style="margin-top:8px;padding:7px 0;font-size:.8rem" onclick="event.stopPropagation();navToPh(${p.id})">🧭 导航到店（模拟）</button>
    <div class="pp-row" style="font-size:.66rem;color:#9A6B1F;background:#FFF7E8;border-radius:6px;padding:4px 6px;margin-top:6px">处方药须凭执业医师处方购买，到店前请电话咨询确认</div>
  </div>`);
  // 实测卡片高度，越界时翻到钉子下方，并钳制在地图可视范围内
  const pop = map.querySelector('.ph-pop');
  if(pop){
    const h = pop.offsetHeight || 190;
    if(y - h - 16 < 4){                       // 上方放不下 → 翻到下方
      pop.classList.add('below');
      pop.style.top = Math.max(4, Math.min(y, H - h - 6)) + 'px';
    }else{
      pop.style.top = Math.min(y, H + h) + 'px'; // 正常在钉子上方
    }
  }
  // 点地图空白处关闭卡片（只绑定一次）
  if(!map.dataset.popBound){
    map.dataset.popBound = '1';
    map.addEventListener('click', e=>{
      if(map.dataset.dragMoved === '1'){ map.dataset.dragMoved = '0'; return; }
      if(e.target.closest && e.target.closest('.ph-pop,.mk,.mk-svg')) return;
      closePhPop();
    });
  }
}

function doWipe(){
  const pid=S.profile&&S.profile.pid;
  if(pid){
    const patients=LS.get('XYWX_doctor_patients',[]);
    if(Array.isArray(patients))LS.set('XYWX_doctor_patients',patients.filter(p=>p&&p.pid!==pid));
    const notices=LS.get('XYWX_patient_notices',[]);
    if(Array.isArray(notices))LS.set('XYWX_patient_notices',notices.filter(n=>n&&n.pid!==pid));
  }
  ['XYWX_patient_profile','XYWX_patient_records','XYWX_patient_meds','XYWX_patient_boxes','XYWX_doctor_profile','XYWX_share_settings','XYWX_moments','XYWX_reminders','XYWX_last_visit','XYWX_find_dist','XYWX_patient_goals','XYWX_event_signups','XYWX_purchase_records','XYWX_feedback','XYWX_patient_notice_acks'].forEach(k=>LS.del(k));

}

  openModal(`<h3 style="margin-bottom:10px">举报动态</h3>

function findPeers(){
  const myBmi=+bmiNow(),myAge=S.profile.age;
  const peers=S.moments.filter(m=>Math.abs(m.bmi-myBmi)<=3&&Math.abs(m.age-myAge)<=5).slice(0,4);
  $('#peer-box').innerHTML=peers.length?peers.map(m=>`<div class="row" style="background:rgba(255,255,255,.15);border-radius:10px;padding:8px 10px;margin-top:6px">

  :`<div style="font-size:.78rem;opacity:.9;margin-top:6px">暂未匹配到相近伙伴，广场里的大家都在为你加油 🌿</div>`;
