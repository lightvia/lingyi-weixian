<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>轻盈维先 · 已用药患者管理服务平台（演示）</title>
<style>
:root{
  --mint:#2BB5A0; --mint-dark:#1E9C89; --mint-light:#E4F7F2; --mint-bg:#F2FAF7;
  --ink:#1F2D2A; --sub:#7A8B87; --line:#E3EFEA; --warn:#E8833A; --red:#D9534F;
  --card-r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--mint-bg);color:var(--ink);max-width:480px;margin:0 auto;min-height:100vh}
button{font-family:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:#fff;outline:none}
input:focus,select:focus{border-color:var(--mint)}
img{max-width:100%}
.hide{display:none!important}

/* 顶部 */
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#2BB5A0,#3EC9B2);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:10px}
.topbar .back{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:16px;line-height:28px;text-align:center;flex:none}
.topbar h1{font-size:1.05rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .mini{font-size:.68rem;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:20px;flex:none}

.demo-strip{position:sticky;top:54px;z-index:49;background:#FFF7E8;color:#9A6B1F;font-size:.72rem;text-align:center;padding:5px 10px;border-bottom:1px solid #F3E3C2}

.screen{padding:14px 14px 86px}
.page-title{font-size:1.15rem;font-weight:700;margin:6px 2px 12px}
.card{background:#fff;border-radius:var(--card-r);padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(30,156,137,.06)}
.card h3{font-size:.95rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.muted{color:var(--sub);font-size:.8rem;line-height:1.6}
.tiny{font-size:.7rem;color:var(--sub)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.btn{display:block;width:100%;background:var(--mint);color:#fff;font-size:1rem;font-weight:600;padding:13px;border-radius:12px;text-align:center}
.btn:active{background:var(--mint-dark)}
.btn.ghost{background:var(--mint-light);color:var(--mint-dark)}
.btn.line{background:#fff;color:var(--mint-dark);border:1px solid var(--mint)}
.btn.sm{width:auto;display:inline-block;padding:7px 14px;font-size:.82rem;border-radius:9px}
.btn.gray{background:#EEF3F1;color:var(--sub)}
.btn.danger{background:#FBEAEA;color:var(--red)}
.link{color:var(--mint-dark);font-size:.82rem}
.tag{display:inline-block;font-size:.68rem;background:var(--mint-light);color:var(--mint-dark);border-radius:20px;padding:2px 9px;margin:2px 4px 2px 0}
.tag.warn{background:#FDF0E4;color:var(--warn)}
.tag.gray{background:#EEF2F1;color:var(--sub)}

.list-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.list-item:last-child{border-bottom:none}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--mint-light);color:var(--mint-dark);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:.9rem}
.avatar.lg{width:56px;height:56px;font-size:1.1rem}

/* 底部 Tab */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;z-index:60;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;text-align:center;color:var(--sub);font-size:.66rem;padding:4px 0}
.tabbar .ico{font-size:1.25rem;display:block;margin-bottom:2px}
.tabbar button.on{color:var(--mint-dark);font-weight:600}

/* 宫格 */
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.svc-grid button{background:#fff;border-radius:12px;padding:14px 4px;text-align:center;font-size:.72rem;color:var(--ink)}
.svc-grid .ico{font-size:1.5rem;display:block;margin-bottom:6px}

/* 表单 */
.field{margin-bottom:14px}
.field label{display:block;font-size:.82rem;color:var(--sub);margin-bottom:6px}
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:.82rem;background:#fff}
.chip.on{background:var(--mint);color:#fff;border-color:var(--mint)}

/* 扫码动画 */
.scan-box{position:relative;width:220px;height:220px;margin:10px auto;border:3px solid var(--mint);border-radius:18px;overflow:hidden;background:#0e2b26}
.scan-box .corner{position:absolute;width:26px;height:26px;border:4px solid #fff;opacity:.9}
.scan-box .c1{top:8px;left:8px;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.scan-box .c2{top:8px;right:8px;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
.scan-box .c3{bottom:8px;left:8px;border-right:none;border-top:none;border-radius:0 0 0 8px}
.scan-box .c4{bottom:8px;right:8px;border-left:none;border-top:none;border-radius:0 0 8px 0}
.scan-line{position:absolute;left:12px;right:12px;height:3px;background:linear-gradient(90deg,transparent,#5CE8D0,transparent);box-shadow:0 0 12px #5CE8D0;animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%{top:14px}50%{top:196px}100%{top:14px}}
.scan-txt{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#BFEEE5;font-size:.75rem}

/* 时间轴 */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:10px 0 14px}
.tl-item::before{content:'';position:absolute;left:-20px;top:16px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--mint)}
.tl-item h4{font-size:.88rem;margin-bottom:4px}
.tl-item .meta{font-size:.75rem;color:var(--sub);line-height:1.7}
.temp-wrap{background:#0F2E29;border-radius:12px;padding:10px;margin-top:8px}

/* 徽章 */
.badge-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.badge-item{text-align:center}
.badge-item .b{width:52px;height:52px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:#EEF3F1}
.badge-item.locked .b{filter:grayscale(1);opacity:.45}
.badge-item span{font-size:.62rem;color:var(--sub)}

/* 广场 */
.post-actions{display:flex;gap:18px;margin-top:8px;font-size:.78rem;color:var(--sub)}
.post-actions button{color:var(--sub);font-size:.78rem}
.post-actions button.liked{color:var(--mint-dark)}

/* 开关 */
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .sl{position:absolute;inset:0;background:#D7E2DE;border-radius:20px;transition:.2s}
.switch .sl::before{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .sl{background:var(--mint)}
.switch input:checked + .sl::before{transform:translateX(20px)}

/* 模态 / Toast */
.modal-mask{position:fixed;inset:0;background:rgba(15,40,35,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal-mask.center{align-items:center;padding:24px}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:22px 18px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;animation:up .25s}
.modal-mask.center .modal{border-radius:18px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(20,40,36,.88);color:#fff;padding:12px 22px;border-radius:12px;font-size:.85rem;z-index:200;display:none;max-width:80%;text-align:center;line-height:1.6}
.remind-pop{position:fixed;inset:0;background:rgba(15,40,35,.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:30px}
.remind-pop .inner{background:#fff;border-radius:18px;padding:24px 20px;width:100%;max-width:340px;text-align:center;animation:up .3s}
.remind-pop .bell{font-size:2.4rem;margin-bottom:8px}

/* 水印 */
.watermark{position:relative;overflow:hidden}
.watermark::after{content:'演示流程';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:rgba(30,156,137,.10);transform:rotate(-24deg);pointer-events:none;font-weight:700}

/* 固定提示条 R2 */
.r2-bar{position:sticky;top:96px;z-index:40;background:#FFF4E5;color:#8A5A17;font-size:.74rem;padding:8px 12px;border-radius:10px;border:1px solid #F3DFC0;margin-bottom:10px;line-height:1.5}
canvas.chart{width:100%;height:180px;display:block}
.progress-note{display:flex;justify-content:space-between;font-size:.7rem;color:var(--sub);margin-top:4px}
.step-dots{display:flex;justify-content:center;gap:8px;margin:8px 0 14px}
.step-dots i{width:8px;height:8px;border-radius:50%;background:#CFE6E0}
.step-dots i.on{background:var(--mint);width:22px;border-radius:6px}
.hr{height:1px;background:var(--line);margin:12px 0}
.kv{display:flex;justify-content:space-between;font-size:.8rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:none}
.kv b{font-weight:600}
.menu-table{width:100%;border-collapse:collapse;font-size:.76rem}
.menu-table th,.menu-table td{border:1px solid var(--line);padding:6px 4px;text-align:center}
.menu-table th{background:var(--mint-light);color:var(--mint-dark);font-weight:600}
.week-pill{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.week-pill button{flex:none;border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px;font-size:.78rem;color:var(--sub)}
.week-pill button.on{background:var(--mint);color:#fff;border-color:var(--mint)}
.course-item{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;align-items:center}
.course-item .lock{font-size:1.1rem;flex:none;width:34px;text-align:center}
.course-item.open{border-color:var(--mint);background:var(--mint-light)}

/* iOS 质感分段控件 */
.seg{position:relative;display:flex;background:#E7F0ED;border-radius:11px;padding:2.5px;overflow:hidden}
.seg button{flex:1;position:relative;z-index:1;padding:7px 0;font-size:.82rem;color:var(--sub);border-radius:8.5px;transition:color .25s;font-weight:500}
.seg button.on{color:var(--ink);font-weight:600}
.seg-thumb{position:absolute;top:2.5px;bottom:2.5px;left:2.5px;border-radius:8.5px;background:#fff;box-shadow:0 2.5px 7px rgba(25,60,52,.16),0 0 1px rgba(25,60,52,.1);transition:transform .3s cubic-bezier(.32,.72,.24,1),width .3s cubic-bezier(.32,.72,.24,1)}

/* 目标进度条 */
.goal-bar{height:8px;border-radius:6px;background:#E7F0ED;overflow:hidden;margin:10px 0 6px}
.goal-bar>div{height:100%;border-radius:6px;background:linear-gradient(90deg,#2BB5A0,#5AD6BF);transition:width .5s cubic-bezier(.32,.72,.24,1)}

/* 科普与活动 */
.sci-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sci-item:last-child{border-bottom:none}
.ev-card{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:#fff}
.ev-card .poster{width:100%;height:150px;object-fit:cover;display:block}
.ev-card .ev-body{padding:12px 14px}
.ev-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.72rem;color:var(--sub);margin-top:6px}
.pill-ok{background:var(--mint-light);color:var(--mint-dark);border-radius:20px;padding:2px 10px;font-size:.68rem}
.pill-warn{background:#FDF0E4;color:var(--warn);border-radius:20px;padding:2px 10px;font-size:.68rem}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<script>
'use strict';
/* ==================== 工具 ==================== */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){/* 预览环境存储被禁用时静默降级为内存态 */}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,ms=1800){const t=$('#toast');t.innerHTML=msg;t.style.display='block';clearTimeout(t._tm);t._tm=setTimeout(()=>t.style.display='none',ms)}
function openModal(html,center=false){$('#modal-root').innerHTML=`<div class="modal-mask ${center?'center':''}" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){$('#modal-root').innerHTML=''}
function todayStr(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(base,n){const d=new Date(base);d.setDate(d.getDate()+n);return d}
function fmt(d){return todayStr(d)}
const DEMO_STRIP='<div class="demo-strip">演示环境 · 数据为模拟数据</div>';

/* ==================== 预置演示数据 ==================== */
const DOCTORS=[
 {code:'DR-2026-0001',name:'陈静怡',title:'主任医师',hospital:'上海市第一人民医院',dept:'内分泌代谢科',clinicTime:'周二上午 · 周四下午',bio:'从事内分泌代谢临床工作18年，擅长肥胖症、2型糖尿病及代谢综合征的综合管理与长期随访。'},
 {code:'DR-2026-0002',name:'李慧敏',title:'副主任医师',hospital:'浙江大学医学院附属第一医院',dept:'内分泌科',clinicTime:'周一全天 · 周三上午',bio:'专注体重管理与代谢性疾病防治，注重饮食运动干预与药物治疗的规范化结合。'},
 {code:'DR-2026-0003',name:'王志强',title:'主治医师',hospital:'北京协和医院',dept:'内分泌科',clinicTime:'周三下午 · 周五上午',bio:'研究方向为肥胖相关代谢异常，倡导以生活方式干预为基础的个体化管理方案。'}
];
function genColdChain(seed){
  const pts=[];let t=3.6+seed*0.2;
  for(let i=0;i<44;i++){t+=(Math.sin(i*0.7+seed)*0.55)+(Math.random()-0.5)*0.4;t=Math.max(1.2,Math.min(6.4,t));pts.push(Math.round(t*10)/10)}
  return pts;
}
const BOXES=(()=>{
  const stores=['康宁大药房张江店','益丰大药房徐汇店','老百姓大药房滨江店','海王星辰药店静安店','国大药房虹桥店'];
  const cities=['杭州','上海'];
  const arr=[];
  for(let i=1;i<=5;i++){
    const shipDate=new Date(2026,8,10+i); // 9月中旬出厂
    const arrive=new Date(shipDate);arrive.setHours(arrive.getHours()+22);
    const inbound=new Date(arrive);inbound.setHours(inbound.getHours()+6);
    arr.push({
      code:'BOX-8842-000'+i,
      batch:'B2026-09'+(10+i*3),
      releaseDate:fmt(new Date(2026,8,8+i)),
      qcNo:'QC-2026-09'+(220+i*7),
      mfr:'杭州先为达生物生产基地',
      shipFrom:cities[i%2]+'生产基地冷库',
      shipTime:fmt(shipDate)+' '+String(shipDate.getHours()).padStart(2,'0')+':30',
      coldCar:'冷藏车 浙A·C88'+(20+i)+'（2-8℃冷链）',
      temps:genColdChain(i),
      arriveTime:fmt(arrive)+' 06:10',
      warehouse:'华东医药冷链中心 2 号库（2-8℃）',
      warehouseIn:fmt(inbound),
      store:stores[i-1],
      storeAccept:fmt(addDays(inbound,2+i)),
      saleChannel:stores[i-1],
      saleDate:'2026-10-'+(24+i),
      expiry:'2027-09-'+(8+i),
      dose:'0.25mg / 周（第 1-4 周起始剂量，具体遵医嘱）'
    });
  }
  return arr;
})();
const boxByCode=c=>BOXES.find(b=>b.code===c);

/* ==================== 全局状态 ==================== */
const S={
  profile:LS.get('XYWX_patient_profile',null),
  boxes:LS.get('XYWX_patient_boxes',[]),           // 我的药盒
  records:LS.get('XYWX_patient_records',[]),       // 体重/腰围/用药打卡
  meds:LS.get('XYWX_patient_meds',[]),             // 用药时点 {date,time,note}
  doctor:LS.get('XYWX_doctor_profile',null),
  share:LS.get('XYWX_share_settings',{weight:false,waist:false,med:false}),
  moments:LS.get('XYWX_moments',null),
  reminders:LS.get('XYWX_reminders',null),
  points:LS.get('XYWX_points',0),
  goals:LS.get('XYWX_patient_goals',{weight:null,waist:null}),
  signups:LS.get('XYWX_event_signups',{}),
  tab:'home', sub:null, subStack:[]
};
const MOMENTS_DEMO=[
 ['阿芳_52kg目标','今天空腹快走40分钟，记录一下，给自己点个赞！',31,'7:42'],
 ['奔跑的桃子','打卡第12周，腰围小了6cm，继续保持记录习惯。',58,'昨天'],
 ['大叔要自律','医生说记录很重要，我把每天的体重都记下来，回头看曲线真有成就感。',24,'昨天'],
 ['小鹿妈妈','这周聚餐多，体重波动了，下周饮食要注意均衡。',33,'昨天'],
 ['清风徐来','晚饭改在7点前吃完，感觉身体轻松不少。',41,'2天前'],
 ['豆豆爸','陪娃踢球也算运动哈哈，今天走了1万2千步。',19,'2天前'],
 ['晴天小猪','开始学做轻食沙拉了，分享一个低油 dressing 配方~',67,'2天前'],
 ['一枚石头','周末不宅家，和朋友爬山去了，风景好心情好。',28,'3天前'],
 ['小满未满','打卡：早餐燕麦+鸡蛋，午餐正常吃，晚餐七分饱。',45,'3天前'],
 ['老王不抽烟','坚持记录一个月了，习惯成自然。',36,'3天前'],
 ['栗子酱','今天去复诊了，医生说我的记录做得很完整，继续保持。',52,'4天前'],
 ['快乐柚子','下雨天在家做了30分钟拉伸，运动后记得补水。',23,'4天前'],
 ['阿Ken','出差也带了体重秤，坚持记录不中断。',15,'5天前'],
 ['南巷旧事','家里人一起跟我散步，健康是全家的事。',29,'5天前'],
 ['薄荷糖','学习了平台上的饮食课，三餐搭配有了新思路。',38,'5天前'],
 ['山水之间','早起称重、记录、吃早餐，一气呵成，舒服。',47,'6天前'],
 ['圆圆要努力','遇到平台期不灰心，调整运动强度再试试。',26,'6天前'],
 ['一杯拿铁','今天自己带了午饭，少油少盐，省钱又健康。',21,'1周前'],
 ['追风少年','骑共享单车通勤来回1小时，顺便锻炼了。',18,'1周前'],

/* 演示用初始记录（建档后若无记录则生成14天） */
function seedRecords(){
  if(S.records.length)return;
  const w0=78.4;
  for(let i=13;i>=0;i--){
    const d=addDays(new Date(),-i);
    S.records.push({date:fmt(d),weight:Math.round((w0-(13-i)*0.18+Math.sin(i)*0.3)*10)/10,waist:Math.round(96-(13-i)*0.35)});
  }
  for(let i=13;i>=0;i--){
    const d=addDays(new Date(),-i);
    S.meds.push({date:fmt(d),time:'20:0'+(i%6),note:i===10?'注射后轻微恶心，次日缓解':(i===5?'正常，无不适':'')});
  }
  saveRecords();
}
function saveRecords(){LS.set('XYWX_patient_records',S.records);LS.set('XYWX_patient_meds',S.meds)}
function bmiNow(){return S.profile?(S.profile.weight/((S.profile.height/100)**2)).toFixed(1):'--'}
function weeksOn(){const c=S.boxes[0];return c?Math.max(1,Math.round((new Date()-new Date(c.saleDate))/6048e5)):1}
function saveGoals(){LS.set('XYWX_patient_goals',S.goals)}
/* 目标进度：已达成 %、距目标剩余量、按最近趋势预估达成天数 */
function goalInfo(metric){
  const g=S.goals,target=g?g[metric]:null;
  if(target==null)return null;
  const recs=S.records.filter(r=>r[metric]!=null);
  if(!recs.length)return null;
  const start=recs[0][metric],now=recs[recs.length-1][metric];
  const denom=start-target;if(!denom)return null;
  const pct=Math.max(0,Math.min(100,Math.round((start-now)/denom*100)));
  const remain=Math.round(Math.abs(now-target)*10)/10;
  let days=null;
  const seg=recs.slice(-7);
  if(seg.length>=2){
    const dd=(new Date(seg[seg.length-1].date)-new Date(seg[0].date))/864e5;
    if(dd>0){const slope=(seg[0][metric]-seg[seg.length-1][metric])/dd; /* 每自然日下降量 */
      if(slope>0.001&&now>target)days=Math.ceil((now-target)/slope)}
  }
  return {start,now,target,pct,remain,done:now<=target,days};
}
const METRIC_NAME={weight:'体重',waist:'腰围'},METRIC_UNIT={weight:'kg',waist:'cm'};
function openGoal(metric){
  const gi=goalInfo(metric),u=METRIC_UNIT[metric],n=METRIC_NAME[metric];
  openModal(`<h3 style="margin-bottom:10px">设定${n}目标</h3>
    <p class="tiny" style="margin-bottom:12px">当前${n} <b>${gi?gi.now:'--'} ${u}</b>。目标可随时修改或清除（演示数据）。</p>
    <div class="field"><label>目标${n}（${u}）</label><input type="number" step="0.1" id="goal-input" value="${gi?gi.target:''}" placeholder="如 ${gi?Math.round(gi.now*0.95*10)/10:''}"></div>
    <button class="btn" onclick="saveGoal('${metric}')">保存目标</button>
    ${gi?`<button class="btn gray" style="margin-top:8px" onclick="clearGoal('${metric}')">清除目标</button>`:''}
    <button class="btn ghost" style="margin-top:8px" onclick="closeModal()">取消</button>`);
}
function saveGoal(metric){
  const v=+$('#goal-input').value;
  if(!v||v<=0){toast('请输入有效的目标数值');return}
  S.goals[metric]=v;saveGoals();closeModal();render();
  toast(METRIC_NAME[metric]+'目标已保存：'+v+' '+METRIC_UNIT[metric]);
}
function clearGoal(metric){S.goals[metric]=null;saveGoals();closeModal();render();toast('已清除'+METRIC_NAME[metric]+'目标')}

function nav(tab,sub){S.tab=tab;S.sub=sub||null;S.subStack=[];render()}

function back(){S.sub=S.subStack.pop()||null;render();window.scrollTo(0,0)}
function topbar(title){return `<div class="topbar"><div class="back" onclick="back()">‹</div><h1>${title}</h1><span class="mini">演示</span></div>${DEMO_STRIP}`}
function shell(inner){

function render(){
  const app=$('#app');
  try{
    if(!S.profile){app.innerHTML=onboardingHTML();bindOnboarding();return}

/* ==================== 通用图表（原生 Canvas） ==================== */
function setupCanvas(cv,h=180){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth||cv.parentElement.clientWidth-20;
  cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);return[ctx,w,h];
}
function lineChart(cv,{labels,data,unit='',min=null,max=null,marks=[],band=null,noteCb=null,color='#2BB5A0',goal=null}){
  const[ctx,W,H]=setupCanvas(cv);
  const pad={l:36,r:10,t:14,b:24};
  let lo=min!=null?min:Math.min(...data)*0.98,hi=max!=null?max:Math.max(...data)*1.02;
  if(hi===lo){hi+=1;lo-=1}
  if(band){lo=Math.min(lo,band[0]);hi=Math.max(hi,band[1])}
  if(goal!=null){lo=Math.min(lo,goal);hi=Math.max(hi,goal)}
  const x=i=>pad.l+(W-pad.l-pad.r)*(i/(data.length-1||1));
  const y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-lo)/(hi-lo));
  ctx.strokeStyle='#E3EFEA';ctx.fillStyle='#8CA39D';ctx.font='10px sans-serif';ctx.textAlign='right';
  for(let g=0;g<=4;g++){const v=lo+(hi-lo)*g/4,yy=y(v);
    ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(W-pad.r,yy);ctx.stroke();
    ctx.fillText((band? v.toFixed(0):v.toFixed(1))+ (unit&&g===4?' '+unit:''),pad.l-5,yy+3)}
  if(band){ctx.fillStyle='rgba(43,181,160,.10)';ctx.fillRect(pad.l,y(band[1]),W-pad.l-pad.r,y(band[0])-y(band[1]));
    ctx.fillStyle='#2BB5A0';ctx.textAlign='left';ctx.fillText('2-8℃ 标准区间',pad.l+4,y(band[1])+12)}
  if(goal!=null){ctx.strokeStyle='rgba(232,131,58,.9)';ctx.setLineDash([6,4]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(pad.l,y(goal));ctx.lineTo(W-pad.r,y(goal));ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=2;
    ctx.fillStyle='#E8833A';ctx.textAlign='left';ctx.fillText('目标 '+goal+unit,pad.l+5,y(goal)-5)}
  marks.forEach(m=>{ctx.strokeStyle='rgba(232,131,58,.8)';ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(x(m.i),pad.t);ctx.lineTo(x(m.i),H-pad.b);ctx.stroke();ctx.setLineDash([])});
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
  data.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(0),y(v)));ctx.stroke();
  ctx.fillStyle=color;data.forEach((v,i)=>{ctx.beginPath();ctx.arc(x(i),y(v),2.4,0,7);ctx.fill()});
  ctx.fillStyle='#8CA39D';ctx.textAlign='center';
  const step=Math.ceil(labels.length/6);
  labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)ctx.fillText(l,x(i),H-8)});
  if(noteCb)cv._note=noteCb;
}

let REC_MODE='day',REC_METRIC='weight';
function segHTML(opts,cur,cb){
  const i=Math.max(0,opts.findIndex(o=>o[0]===cur)),w=100/opts.length;
  return `<div class="seg" style="flex:1">${opts.map(o=>`<button class="${cur===o[0]?'on':''}" onclick="${cb}('${o[0]}')">${o[1]}</button>`).join('')}<div class="seg-thumb" style="width:calc(${w}% - 2.5px);transform:translateX(${i*100}%)"></div></div>`;
}
function setMetric(m){REC_METRIC=m;render()}
function goalCardHTML(metric){
  const n=METRIC_NAME[metric],u=METRIC_UNIT[metric],gi=goalInfo(metric);
  if(!gi)return `<div class="card"><div class="row between"><h3 style="margin:0"><span class="dot"></span>我的${n}目标</h3><span class="tag gray">未设定</span></div>
    <p class="muted" style="margin:10px 0">设定${n}目标后，每天可以看到距离目标还有多远、已达成百分之多少。</p>
    <button class="btn" onclick="openGoal('${metric}')">设定${n}目标</button></div>`;
  return `<div class="card"><div class="row between"><h3 style="margin:0"><span class="dot"></span>我的${n}目标</h3>
    <button class="btn sm line" onclick="openGoal('${metric}')">修改</button></div>
    <div class="kv"><span>目标${n}</span><b>${gi.target} ${u}</b></div>
    <div class="kv"><span>当前${n}（起始 ${gi.start}）</span><b>${gi.now} ${u}</b></div>
    <div class="goal-bar"><div style="width:${gi.pct}%"></div></div>
    <div class="progress-note"><span>已达成 ${gi.pct}%</span><span>${gi.done?'已达成目标 🎉':(gi.days?`按当前趋势约 ${gi.days} 天达成`:'趋势积累中…')}</span></div>

function consecutiveDays(){
  let n=0;const set=new Set(S.records.map(r=>r.date));const d=new Date();
  if(!set.has(todayStr()))d.setDate(d.getDate()-1);
  while(set.has(todayStr(d))){n++;d.setDate(d.getDate()-1)}return n;
}
function ringSVG(cur,max){
  const pct=Math.min(1,cur/max),r=34,c=2*Math.PI*r;
  return `<svg viewBox="0 0 90 90" style="width:110px;display:block;margin:0 auto">
    <circle cx="45" cy="45" r="${r}" fill="none" stroke="#E3EFEA" stroke-width="9"/>
    <circle cx="45" cy="45" r="${r}" fill="none" stroke="#2BB5A0" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 45 45)"/>
    <text x="45" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#1E9C89">${cur}/${max}</text></svg>`;
}
function toggleRemind(on){
  S.reminders.enabled=on;LS.set('XYWX_reminders',S.reminders);
  if(on)setTimeout(()=>showRemindPop('用药记录','到时间了，记得记录今天的用药情况哦'),1200);
  toast(on?'模拟提醒已开启':'模拟提醒已关闭');
}
function showRemindPop(title,msg){
  const el=document.createElement('div');el.className='remind-pop';
  el.innerHTML=`<div class="inner"><div class="bell">🔔</div><b>${title}</b>
    <p class="muted" style="margin:10px 0 16px">${msg}</p>
    <button class="btn" onclick="this.closest('.remind-pop').remove()">知道了，去记录</button></div>`;
  el.onclick=e=>{if(e.target===el)el.remove()};document.body.appendChild(el);
}
function openEntry(type){
  openModal(`<h3 style="margin-bottom:10px">${type==='weight'?'补录体重':'补录腰围'}</h3>
    <div class="field"><label>日期</label><input type="date" id="en-date" value="${todayStr()}" max="${todayStr()}"></div>
    <div class="field"><label>${type==='weight'?'体重（kg）':'腰围（cm）'}</label><input type="number" step="0.1" id="en-val" placeholder="${type==='weight'?'如 77.8':'如 94'}"></div>
    <button class="btn" onclick="doEntry('${type}')">保存记录</button>
    <button class="btn gray" style="margin-top:8px" onclick="closeModal()">取消</button>`);
}
function doEntry(type){
  const d=$('#en-date').value,v=+$('#en-val').value;
  if(!d||!v){toast('请完整填写');return}
  const rec=S.records.find(r=>r.date===d);
  if(rec){rec[type]=v}else{S.records.push({date:d,[type]:v});S.records.sort((a,b)=>a.date<b.date?-1:1)}
  S.points+=2;LS.set('XYWX_points',S.points);saveRecords();closeModal();render();
  toast('已保存（演示数据）<br><span style="font-size:.72rem">健康数据仅本地存储</span>');
}
function drawRecord(){
  const cv=$('#rec-chart');if(!cv)return;
  const metric=REC_METRIC,u=METRIC_UNIT[metric],color=metric==='weight'?'#2BB5A0':'#3E7BFA';
  const has=r=>r[metric]!=null;
  let labels=[],data=[];
  if(REC_MODE==='day'){const d=S.records.slice(-7).filter(has);labels=d.map(r=>r.date.slice(5));data=d.map(r=>r[metric])}
  else if(REC_MODE==='week'){const wk=[...S.records].reverse().filter(has);
    for(let i=0;i<wk.length;i+=7){const seg=wk.slice(i,i+7);if(!seg.length)continue;labels.unshift('第'+Math.ceil((i+1)/7)+'周');
      data.unshift(seg.reduce((s,r)=>s+r[metric],0)/seg.length)}}
  else{const mo={};S.records.filter(has).forEach(r=>{(mo[r.date.slice(0,7)]=mo[r.date.slice(0,7)]||[]).push(r[metric])});
    Object.keys(mo).sort().forEach(k=>{labels.push(k.slice(2));data.push(mo[k].reduce((a,b)=>a+b,0)/mo[k].length)})}
  if(!data.length){cv.style.display='none';$('#rec-tip').textContent='暂无'+METRIC_NAME[metric]+'记录，可先补录数据';return}
  cv.style.display='block';
  const marks=data.map((_,i)=>S.meds.some(m=>m.date.endsWith(labels[i])||m.date.slice(5)===labels[i])?{i}:null).filter(Boolean);
  const gi=goalInfo(metric);
  lineChart(cv,{labels,data:data.map(v=>Math.round(v*10)/10),unit:u,marks,color,goal:gi?gi.target:null});
  cv.onclick=e=>{
    const rect=cv.getBoundingClientRect(),pad=36;
    const x=(e.clientX-rect.left)*(cv.clientWidth/rect.width);
    const idx=Math.round((x-pad)/((cv.clientWidth-pad-10)/(data.length-1||1)));
    if(idx<0||idx>=data.length)return;
    const med=S.meds.find(m=>m.date.slice(5)===labels[idx]||m.date.endsWith(labels[idx]));
    $('#rec-tip').textContent=`${labels[idx]}：${METRIC_NAME[metric]} ${data[idx]?data[idx].toFixed(1):'--'} ${u}`+(med?` · 用药 ${med.time}${med.note?'（备注：'+med.note+'）':''}`:'');
  };
}

  return `<div class="page-title">减重广场</div>
  <div class="card" style="background:linear-gradient(135deg,#2BB5A0,#49CDB6);color:#fff">
    <div class="row between"><div><b>找同路人</b><div style="font-size:.74rem;opacity:.9;margin-top:3px">按 BMI ±3、年龄 ±5 为您匹配相似伙伴（模拟）</div></div>
    <button style="background:rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:8px 14px;font-size:.8rem" onclick="findPeers()">开始匹配</button></div>
    <div id="peer-box" style="margin-top:10px"></div>
  </div>
  ${S.moments.map(m=>`
  <div class="card" style="padding:14px">
    <div class="row"><div class="avatar" style="width:38px;height:38px;font-size:.8rem">${esc(m.name[0])}</div>
      <div style="flex:1"><b style="font-size:.86rem">${esc(m.name)}</b><div class="tiny">${m.time} · BMI ${m.bmi.toFixed(1)} · ${m.age}岁</div></div>
      <button class="tiny" style="color:var(--sub)" onclick="reportPost(${m.id})">举报</button></div>
    <p style="font-size:.86rem;line-height:1.7;margin-top:8px">${esc(m.text)}</p>
    <div class="post-actions">
      <button class="${m.liked?'liked':''}" onclick="likePost(${m.id})">👍 ${m.likes}</button>
      <button onclick="commentPost(${m.id})">💬 ${m.comments}</button>
      <span style="margin-left:auto">🌿</span>
    </div>
  </div>`).join('')}
  <p class="tiny" style="text-align:center;margin-top:6px">以上为模拟动态 · 评论区内容经平台审核（演示）</p>`;
}
function likePost(id){const m=S.moments.find(x=>x.id===id);m.liked=!m.liked;m.likes+=m.liked?1:-1;
  LS.set('XYWX_moments',S.moments);render()}
function commentPost(id){
  openModal(`<h3 style="margin-bottom:10px">评论（模拟）</h3>
  <div class="card" style="box-shadow:none;border:1px solid var(--line);margin-bottom:12px"><p style="font-size:.84rem">${esc(S.moments.find(x=>x.id===id).text)}</p></div>
  <div class="field"><input id="cm-input" placeholder="友善评论，互相鼓励…"></div>
  <button class="btn" onclick="doComment(${id})">发布评论（模拟）</button>
  <button class="btn gray" style="margin-top:8px" onclick="closeModal()">取消</button>`);
}
function doComment(id){const v=$('#cm-input').value.trim();if(!v){toast('请输入评论内容');return}
  S.moments.find(x=>x.id===id).comments++;LS.set('XYWX_moments',S.moments);closeModal();render();toast('评论已发布（模拟）')}
function reportPost(id){
  openModal(`<h3 style="margin-bottom:10px">举报动态</h3>
  <p class="tiny" style="margin-bottom:12px">请选择举报原因，平台将在 24 小时内处理（模拟）。</p>
  ${['含推广或购买引导','内容不实','不当言论','其他'].map(r=>`<button class="btn line" style="margin-bottom:8px;text-align:left;padding:11px 14px" onclick="closeModal();toast('已收到举报（模拟）：${r}')">${r}</button>`).join('')}
  <button class="btn gray" onclick="closeModal()">取消</button>`);
}
function findPeers(){
  const myBmi=+bmiNow(),myAge=S.profile.age;
  const peers=S.moments.filter(m=>Math.abs(m.bmi-myBmi)<=3&&Math.abs(m.age-myAge)<=5).slice(0,4);
  $('#peer-box').innerHTML=peers.length?peers.map(m=>`<div class="row" style="background:rgba(255,255,255,.15);border-radius:10px;padding:8px 10px;margin-top:6px">
    <div class="avatar" style="width:32px;height:32px;font-size:.72rem;background:rgba(255,255,255,.25);color:#fff">${esc(m.name[0])}</div>
    <div style="flex:1;font-size:.78rem">${esc(m.name)} · BMI ${m.bmi.toFixed(1)} · ${m.age}岁</div>
    <button style="color:#fff;font-size:.74rem;background:rgba(255,255,255,.2);border-radius:14px;padding:4px 12px" onclick="toast('已发送结伴邀请（模拟）')">＋结伴</button></div>`).join('')
  :`<div style="font-size:.78rem;opacity:.9;margin-top:6px">暂未匹配到相近伙伴，广场里的大家都在为你加油 🌿</div>`;
}

/* ==================== 启动 ==================== */
render();
</script>
</body>
</html>
